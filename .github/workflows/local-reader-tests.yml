name: Pelex local document reader tests
on:
  push:
    branches: [main]
    paths:
      - 'pelex_local_reader.js'
      - 'tests/local-reader.test.cjs'
      - 'index.html'
      - '.github/workflows/local-reader-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pelex_local_reader.js'
      - 'tests/local-reader.test.cjs'
      - 'index.html'
      - '.github/workflows/local-reader-tests.yml'
jobs:
  local-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run local reader tests
        run: node --test tests/local-reader.test.cjs
      - name: Verify reader JavaScript syntax
        run: node --check pelex_local_reader.js
