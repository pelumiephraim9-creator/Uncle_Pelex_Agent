name: Pelex Monitor desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pelex-monitor-desktop/**'
      - '.github/workflows/pelex-monitor-build.yml'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: pelex-business-monitor-windows
          - os: macos-latest
            command: npm run dist:mac
            artifact: pelex-business-monitor-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pelex-monitor-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run privacy tests
        run: npm test
      - name: Package desktop app
        run: ${{ matrix.command }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pelex-monitor-desktop/dist/*
          if-no-files-found: error
          retention-days: 14
