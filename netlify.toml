[build]
  publish = "."
  functions = "netlify/functions"

# Always revalidate the page and service worker so new deploys are picked up right away
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
