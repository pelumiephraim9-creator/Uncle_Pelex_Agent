[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "https://unclepelexai.netlify.app/*"
  to = "https://pelex.tech/:splat"
  status = 301
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
